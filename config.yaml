# Euromillions ML Predictor Configuration

api:
  base_url: "https://euromillions.api.pedromealha.dev"
  timeout: 30
  rate_limit: 2.0
  retry_attempts: 4
  retry_backoff: 2.0

data:
  cache_dir: "./data/cache"
  cache_ttl_historical: 0
  cache_ttl_current: 86400

lottery:
  numbers_range: [1, 50]
  stars_range: [1, 12]
  numbers_count: 5
  stars_count: 2
